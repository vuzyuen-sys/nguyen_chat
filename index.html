<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AAA Cyberpunk Dice</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }

    canvas {
        display: block;
    }

    #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: cyan;
        font-family: monospace;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="info">
    AAA CYBERPUNK DICE<br>
    CLICK = THROW DICE
</div>

<script type="module">

////////////////////////////////////////////////////////////
// IMPORTS
////////////////////////////////////////////////////////////

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js';

import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js';

import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js';

import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/exporters/GLTFExporter.js';

import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 10, 30);

////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 10);

////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// POST PROCESSING
////////////////////////////////////////////////////////////

const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.2,
    0.5,
    0.2
);

composer.addPass(bloomPass);

////////////////////////////////////////////////////////////
// CONTROLS
////////////////////////////////////////////////////////////

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////

const ambient = new THREE.AmbientLight(0x00ffff, 0.4);
scene.add(ambient);

const pink = new THREE.PointLight(0xff00ff, 60);
pink.position.set(5, 10, 5);
pink.castShadow = true;
scene.add(pink);

const cyan = new THREE.PointLight(0x00ffff, 60);
cyan.position.set(-5, 8, -5);
scene.add(cyan);

////////////////////////////////////////////////////////////
// FLOOR
////////////////////////////////////////////////////////////

const floorGeo = new THREE.PlaneGeometry(50, 50);

const floorMat = new THREE.MeshStandardMaterial({
    color: 0x050505,
    metalness: 1,
    roughness: 0.2
});

const floor = new THREE.Mesh(floorGeo, floorMat);

floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;

scene.add(floor);

////////////////////////////////////////////////////////////
// PHYSICS WORLD
////////////////////////////////////////////////////////////

const world = new CANNON.World({
    gravity: new CANNON.Vec3(0, -9.82, 0)
});

////////////////////////////////////////////////////////////
// FLOOR PHYSICS
////////////////////////////////////////////////////////////

const floorBody = new CANNON.Body({
    type: CANNON.Body.STATIC,
    shape: new CANNON.Plane()
});

floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);

world.addBody(floorBody);

////////////////////////////////////////////////////////////
// CREATE DICE TEXTURES
////////////////////////////////////////////////////////////

function createFace(number) {

    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;

    const ctx = canvas.getContext('2d');

    // futuristic neon background
    const grad = ctx.createLinearGradient(0,0,512,512);

    grad.addColorStop(0, '#111');
    grad.addColorStop(1, '#222');

    ctx.fillStyle = grad;
    ctx.fillRect(0,0,512,512);

    // neon border
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 20;
    ctx.strokeRect(20,20,472,472);

    // glowing dots
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 40;

    const r = 35;

    function dot(x,y){
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
    }

    const p = {
        c:[256,256],
        tl:[128,128],
        tr:[384,128],
        bl:[128,384],
        br:[384,384],
        ml:[128,256],
        mr:[384,256]
    };

    switch(number){
        case 1: dot(...p.c); break;
        case 2: dot(...p.tl); dot(...p.br); break;
        case 3: dot(...p.tl); dot(...p.c); dot(...p.br); break;
        case 4:
            dot(...p.tl); dot(...p.tr);
            dot(...p.bl); dot(...p.br);
            break;
        case 5:
            dot(...p.tl); dot(...p.tr);
            dot(...p.c);
            dot(...p.bl); dot(...p.br);
            break;
        case 6:
            dot(...p.tl); dot(...p.tr);
            dot(...p.ml); dot(...p.mr);
            dot(...p.bl); dot(...p.br);
            break;
    }

    const tex = new THREE.CanvasTexture(canvas);

    return new THREE.MeshPhysicalMaterial({
        map: tex,
        metalness: 1,
        roughness: 0.1,
        transmission: 0.05,
        clearcoat: 1,
        emissive: new THREE.Color(0x00ffff),
        emissiveIntensity: 0.3
    });
}

////////////////////////////////////////////////////////////
// DICE
////////////////////////////////////////////////////////////

const diceGeo = new THREE.BoxGeometry(2,2,2);

const diceMat = [
    createFace(1),
    createFace(2),
    createFace(3),
    createFace(4),
    createFace(5),
    createFace(6)
];

const dice = new THREE.Mesh(diceGeo, diceMat);

dice.castShadow = true;
dice.position.y = 5;

scene.add(dice);

////////////////////////////////////////////////////////////
// PHYSICS BODY
////////////////////////////////////////////////////////////

const diceBody = new CANNON.Body({
    mass: 1,
    shape: new CANNON.Box(new CANNON.Vec3(1,1,1)),
    position: new CANNON.Vec3(0,5,0)
});

world.addBody(diceBody);

////////////////////////////////////////////////////////////
// THROW DICE
////////////////////////////////////////////////////////////

window.addEventListener('click', () => {

    diceBody.velocity.set(
        (Math.random()-0.5)*10,
        10,
        (Math.random()-0.5)*10
    );

    diceBody.angularVelocity.set(
        Math.random()*20,
        Math.random()*20,
        Math.random()*20
    );
});

////////////////////////////////////////////////////////////
// EXPORT GLTF
////////////////////////////////////////////////////////////

window.addEventListener('keydown', (e)=>{

    if(e.key === 'e'){

        const exporter = new GLTFExporter();

        exporter.parse(scene, function(result){

            const blob = new Blob(
                [JSON.stringify(result)],
                {type:'application/json'}
            );

            const link = document.createElement('a');

            link.href = URL.createObjectURL(blob);
            link.download = 'cyberpunk_dice.gltf';
            link.click();
        });
    }
});

////////////////////////////////////////////////////////////
// ANIMATION LOOP
////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    world.step(1/60);

    dice.position.copy(diceBody.position);
    dice.quaternion.copy(diceBody.quaternion);

    controls.update();

    composer.render();
}

animate();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener('resize', ()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    composer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>
</body>
</html>
